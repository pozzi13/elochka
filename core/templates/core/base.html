{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="yandex-verification" content="d5507b6a7da2fc2b" />
  <title>Массажный салон «Ёлочка» — Нижневартовск</title>
  <meta name="description" content="Лечебный, расслабляющий, антицеллюлитный массаж и массаж спины. Запись онлайн." />
  <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>
  <header class="header">
    <div class="container header__inner">
      <a class="logo" href="{% url 'core:home' %}">Ёлочка</a>

      <nav class="nav">
        <ul class="nav__list">
          <li><a href="{% url 'core:home' %}#services">Услуги</a></li>
          <li><a href="{% url 'core:home' %}#prices">Цены</a></li>
          <li><a href="{% url 'core:reviews' %}">Отзывы</a></li>
          <li><a href="{% url 'core:contacts' %}">Контакты</a></li>
        </ul>
      </nav>

      <a class="btn btn--primary" href="{% url 'core:home' %}#booking">Записаться</a>
    </div>
  </header>

  <main id="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2025 «Ёлочка», Нижневартовск</p>
      <p><a href="{% url 'core:sitemap_html' %}">Карта сайта</a></p>
    </div>
  </footer>

  <script src="{% static 'script.js' %}"></script>
</body>
</html>
